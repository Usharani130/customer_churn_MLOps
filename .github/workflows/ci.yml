# YAML config placeholder
# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'releases/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Linting and Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up builds by caching dependencies

      - name: Upgrade pip and install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Pytest Suite
        env:
          MODEL_PATH: "models/pipeline.joblib"
        run: |
          pytest tests/ -v --durations=10

  build-containers:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test # Ensures Docker images only build if tests pass

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend (FastAPI) Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false # CI check only; set to true in CD workflows
          tags: churn-backend-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend (Streamlit) Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.streamlit
          push: false
          tags: churn-frontend-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max